<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 Smart LED Controller</title>
<link rel="manifest" href="./manifest.json">
<style>
body { font-family: Arial, sans-serif; background:#111; color:#eee; margin:0; padding:12px; }
h1,h2 { margin:8px 0; }
.card { background:#1e1e1e; border:1px solid #333; border-radius:8px; padding:12px; margin-bottom:14px; }
label { display:block; margin-top:8px; font-size:14px; }
input[type=range] { width:100%; }
select, input[type=text], input[type=number], button {
  padding:8px; margin-top:6px; border-radius:4px; border:1px solid #444; background:#222; color:#fff; font-size:14px;
}
button { cursor:pointer; }
.btn-green { background:#1d5e2a; border-color:#28a745; }
.btn-red { background:#631c1c; border-color:#dc3545; }
.btn-blue { background:#1a426e; border-color:#007bff; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.step-row, .playlist-row { border:1px solid #333; padding:8px; margin:6px 0; border-radius:6px; background:#181818; }
.playlist-row.active-item { border:2px solid #28a745; background:#1a2a1e; }
.small { font-size:12px; color:#aaa; }
.meter-bg { width:100%; height:14px; background:#2a2a2a; border-radius:7px; overflow:hidden; margin-top:6px; }
.meter-fill { height:100%; width:0%; background:linear-gradient(90deg, #28a745, #ffc107, #dc3545); transition:width 0.05s linear; }
.badge { padding:4px 8px; border-radius:4px; font-size:12px; font-weight:bold; background:#333; }
#debugLog { font-family:monospace; font-size:11px; color:#0f0; background:#000; padding:6px; border-radius:4px; margin-top:8px; word-break:break-all; }
</style>
</head>
<body>

<div class="row" style="justify-content:space-between;">
  <h1>LED Poi Control</h1>
  <span id="connStatus" class="badge" style="color:#ffc107;">Starting...</span>
</div>
<div id="debugLog">HTML Loaded. Loading app.js...</div>

<div class="card" style="border-color:#28a745;">
  <div class="row" style="justify-content:space-between;">
    <h2 style="margin:0;">Smart Audio Sync (Mic)</h2>
    <button id="micBtn" class="btn-green" onclick="toggleMic()">Start Mic Listener</button>
  </div>
  <div class="row" style="margin-top:10px; justify-content:space-between;">
    <div>BPM: <strong id="bpmVal" style="font-size:18px; color:#4da6ff;">--</strong></div>
    <div>Energy: <strong id="energyLabel" style="color:#28a745;">IDLE</strong></div>
    <div>Scale: <strong id="scaleVal">1.00x</strong></div>
  </div>
  <div class="meter-bg"><div id="bassMeter" class="meter-fill"></div></div>
  <div class="row" style="margin-top:10px;">
    <label style="margin:0;"><input type="checkbox" id="smartJumpToggle" onchange="syncSmartFlags()"> Auto-Switch by Energy</label>
    <label style="margin:0;"><input type="checkbox" id="autoTempoToggle" onchange="syncSmartFlags()"> Auto-Scale BPM</label>
  </div>
  <div class="row" style="margin-top:8px;">
    <label style="margin:0; flex:1;">Base BPM: <input type="number" id="baseBpm" value="128" min="60" max="200" style="width:65px;"></label>
    <label style="margin:0; flex:1;">Sensitivity: <input type="range" id="sensitivity" min="115" max="180" value="140"></label>
  </div>
</div>

<div class="card">
  <h2>Global & Quick Load</h2>
  <div class="row">
    <label style="flex:1;">Master IP: <input type="text" id="espIp" value="http://192.168.4.1" style="width:145px;" onchange="loadAll()"></label>
    <button onclick="loadAll()">Reconnect</button>
  </div>
  <label>Brightness: <span id="bval">128</span>
    <input type="range" id="brightness" min="0" max="255" value="128" oninput="document.getElementById('bval').innerText=this.value" onchange="updateGlobalBrightness()">
  </label>
  <label>Load Preset:
    <select id="presetSelect" onchange="applySelectedPreset()"></select>
    <button class="btn-red" onclick="deletePreset()">Delete</button>
  </label>
</div>

<div class="card">
  <h2>Smart Playlist</h2>
  <div class="row">
    <button class="btn-green" onclick="startPlaylist()">Start</button>
    <button class="btn-red" onclick="stopPlaylist()">Stop</button>
    <button class="btn-blue" onclick="skipNext()">Skip Next</button>
    <button onclick="addPlaylistRow()">+ Item</button>
    <button onclick="savePlaylist()">Save</button>
  </div>
  <div id="playlistContainer"></div>
</div>

<div class="card">
  <h2>Mode & Sequencer Editor</h2>
  <label>Mode:
    <select id="effect" onchange="toggleSections()">
      <option value="0">Solid Color</option>
      <option value="1">Rainbow</option>
      <option value="2">Step Sequencer</option>
    </select>
  </label>
  <div id="solidBox">
    <label>Solid Color: <input type="color" id="solidColor" value="#ffffff" onchange="sendState()"></label>
  </div>
  <div id="rainbowBox" style="display:none;">
    <label>Rainbow Speed: <span id="rval">5</span>
      <input type="range" id="rainbowSpeed" min="1" max="50" value="5" oninput="document.getElementById('rval').innerText=this.value" onchange="sendState()">
    </label>
  </div>
  <div id="seqBox" style="display:none;">
    <label style="margin:10px 0;"><input type="checkbox" id="propagationMode" onchange="sendState()"> Enable LED Propagation</label>
    <div id="steps"></div>
    <button onclick="addStep()">+ Add Step</button>
  </div>
  <div class="row" style="margin-top:10px;">
    <button class="btn-blue" onclick="applyEffect()">Apply Now</button>
    <input type="text" id="presetName" placeholder="Preset name">
    <button class="btn-green" onclick="savePreset()">Save Preset</button>
  </div>
</div>

<script src="./app.js?v=5"></script>
</body>
</html>
