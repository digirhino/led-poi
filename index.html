<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED Poi Master Control</title>
<link rel="manifest" href="./manifest.json">
<style>

  body { background: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
  #page { width: 100%; max-width: 500px; }
  .panel { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
  .panel h3, .panel h4 { margin-top: 0; text-align: center; color: #bb86fc; }
  .topColumns { display: flex; gap: 15px; justify-content: space-between; }
  .column { flex: 1; text-align: center; }
  input[type="range"] { width: 100%; cursor: pointer; }
  input[type="color"] { display: none; }
  button { background: #333; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin: 4px; transition: 0.2s; }
  button:hover { background: #444; }
  button:active { background: #6200ee; }
  
  .rainbow-btn.active { background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff); animation: rainbow-anim 3s ease infinite; color: white; }
  @keyframes rainbow-anim { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

  .step, .playlistItem { position: relative; background: #252525; border: 1px solid #444; padding: 10px; margin: 6px 0; display: flex; align-items: center; justify-content: center; gap: 5px; border-radius: 8px; }
  .step input[type="number"], .playlistItem input[type="number"] { width: 45px; background: rgba(0,0,0,0.3); color: #fff; border: 1px solid #555; padding: 4px; border-radius: 3px; }
  .step-btn { background: rgba(0,0,0,0.3); color: #fff; border: 1px solid #555; border-radius: 3px; padding: 4px 8px; cursor: pointer; font-size: 14px; margin: 0; }
  .step-btn:hover { background: rgba(255,255,255,0.1); }
  
  .active-item { border: 2px solid #bb86fc !important; box-shadow: 0 0 10px #bb86fc; }
  .smart-btn { background: #1d5e2a; border: 1px solid #28a745; font-weight: bold; }
</style>

</head>
<body>
<div id="page">
    <div class="panel">
    <h3>Master Control</h3>
    <div style="text-align:center; margin-bottom:10px; font-size:12px;">
      ESP32 IP: <input type="text" id="espHost" value="http://192.168.4.1" style="width:130px; background:#252525; color:#fff; border:1px solid #444; padding:3px; border-radius:3px;">
      <span id="statusDot" style="color:#ffc107; margin-left:6px;">● Connecting</span>
    </div>
    <div class="topColumns">
      <div class="column">Brightness<br><input type="range" id="brightness" min="1" max="255" onchange="apply(currentEffect)"></div>
      <div class="column">Rainbow Speed<br><input type="range" id="rainbowSpeed" min="200" max="255" onchange="apply(currentEffect)"></div>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px; margin-top:15px;">
      <input type="color" id="solidColorInput">
      <button id="solidColorBtn" style="width:100%;">Solid Colour</button>
      <button id="rainbowBtn" class="rainbow-btn" style="width:100%;">Rainbow Mode</button>
    </div>
  </div>

  <div class="panel">
    <h4>Sequencer</h4>
    <div style="text-align:center; margin-bottom:10px;">
      <label><input type="checkbox" id="propagationMode" onchange="apply(currentEffect)"> Propagation Chase</label>
    </div>
    <div id="steps"></div>
    <button onclick="addStep()" style="width:100%;">+ Add Step</button>
  </div>

  <div class="panel">
    <h3>Presets & Playlist</h3>
    <select id="presetList" style="width:100%; padding:8px; background:#222; color:#fff; border:1px solid #444;"></select>
    <div style="display:flex; justify-content:center; gap:5px; margin-top:10px;">
      <button onclick="applyPreset()">Apply</button>
      <button onclick="savePreset()">Save</button>
      <button onclick="deletePreset()">Delete</button>
      <button onclick="exportPreset()">Export</button>
      <input type="file" id="importPresetFile" style="display:none" onchange="importPreset()">
      <button onclick="document.getElementById('importPresetFile').click()">Import</button>
    </div>
    <div style="margin-top:10px; border-top:1px solid #444; padding-top:10px; display:flex; justify-content:center; flex-wrap:wrap;">
        <input type="file" id="importPlaylistFile" style="display:none" onchange="importPlaylist()">
        <button onclick="document.getElementById('importPlaylistFile').click()">Import Playlist</button>
        <button onclick="exportPlaylist()">Export Playlist</button>
        <button class="smart-btn" onclick="window.location.href='./smart.html'">Smart Playlist</button>
    </div>
    <div style="margin-top:15px;">
      <button onclick="addPlaylistItem()" style="width:100%;">Add to Playlist</button>
      <div id="playlistSteps" style="margin-top:10px;"></div>
      <div style="display:flex; justify-content:center; gap:5px; margin-top:10px;">
        <button onclick="playlistStart()">Play</button>
        <button onclick="playlistStop()">Pause</button>
      </div>
    </div>
  </div>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

const _origFetch = window.fetch;
window.fetch = function(url, opts) {
  if (typeof url === 'string' && url.startsWith('/')) {
    const base = document.getElementById('espHost').value.replace(/\/$/, '');
    url = base + url;
  }
  return _origFetch.call(this, url, opts);
};

let sequencerSteps = [];
let currentEffect = 0;
let playlist = [];
let presetsData = {};
let currentPlaylistIdx = 0;
let isEditing = false; 
let isSaving = false;

function rgbToHex(r, g, b) { return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1); }
function hexToRgb(h) { const x = parseInt(h.slice(1), 16); return { r: (x >> 16) & 255, g: (x >> 8) & 255, b: x & 255 }; }

const colorInput = document.getElementById('solidColorInput');
const colorBtn = document.getElementById('solidColorBtn');
const rainbowBtn = document.getElementById('rainbowBtn');

// Added listener
addEditListeners(colorInput);

colorBtn.onclick = () => colorInput.click();
colorInput.onchange = (e) => { colorBtn.style.backgroundColor = e.target.value; apply(0); };
rainbowBtn.onclick = () => { currentEffect = (currentEffect === 1) ? 0 : 1; apply(currentEffect); };

function addEditListeners(el) {
    el.onfocus = () => { isEditing = true; };
    el.onblur = () => { isEditing = false; };
    
    // Hardening guard for input color types
    if (el.type === 'color') {
        el.onclick = (e) => { 
            isEditing = true; 
        };
        el.onchange = () => { 
            isEditing = false; 
        };
    }
}


function renderSequencer() {
  const container = document.getElementById('steps');
  container.innerHTML = '';
  sequencerSteps.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'step';
    div.style.backgroundColor = rgbToHex(s.r, s.g, s.b);
    const picker = document.createElement('input');
    picker.type = 'color';
    picker.value = rgbToHex(s.r, s.g, s.b);
    addEditListeners(picker);
    picker.onchange = (e) => {
      const c = hexToRgb(e.target.value);
      s.r = c.r; s.g = c.g; s.b = c.b;
      div.style.backgroundColor = e.target.value;
      apply(2);
    };
    div.onclick = (e) => { if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') picker.click(); };
    const createInput = (val, key, w) => {
      const inp = document.createElement('input');
      inp.type = 'number'; inp.value = val; inp.style.width = w;
      addEditListeners(inp);
      inp.onclick = (e) => e.stopPropagation();
      inp.onchange = (e) => { 
        s[key] = parseInt(e.target.value); 
        if(key === 'r' || key === 'g' || key === 'b') div.style.backgroundColor = rgbToHex(s.r, s.g, s.b);
        apply(2);
      };
      return inp;
    };
    div.appendChild(picker);
    div.appendChild(createInput(s.r, 'r', '25px'));
    div.appendChild(createInput(s.g, 'g', '25px'));
    div.appendChild(createInput(s.b, 'b', '25px'));
    div.appendChild(createInput(s.duration, 'duration', '50px'));
    div.appendChild(createInput(s.fadeDuration, 'fadeDuration', '50px'));
    
    const upBtn = document.createElement('button'); upBtn.innerHTML = '&#8593;'; upBtn.className = 'step-btn';
    upBtn.onclick = (e) => { e.stopPropagation(); [sequencerSteps[i-1], sequencerSteps[i]] = [sequencerSteps[i], sequencerSteps[i-1]]; renderSequencer(); apply(2); };
    const downBtn = document.createElement('button'); downBtn.innerHTML = '&#8595;'; downBtn.className = 'step-btn';
    downBtn.onclick = (e) => { e.stopPropagation(); [sequencerSteps[i+1], sequencerSteps[i]] = [sequencerSteps[i], sequencerSteps[i+1]]; renderSequencer(); apply(2); };
    const delBtn = document.createElement('button'); delBtn.innerHTML = '&#10006;'; delBtn.className = 'step-btn';
    delBtn.onclick = (e) => { e.stopPropagation(); sequencerSteps.splice(i, 1); renderSequencer(); apply(2); };
    div.appendChild(upBtn); div.appendChild(downBtn); div.appendChild(delBtn);
    container.appendChild(div);
  });
}

function renderPlaylist() {
  const container = document.getElementById('playlistSteps');
  container.innerHTML = '';
  playlist.forEach((item, index) => {
    const row = document.createElement('div');
    row.className = 'playlistItem';
    if(index === currentPlaylistIdx) row.classList.add('active-item');
    
    if(presetsData[item.presetName]) {
        const steps = presetsData[item.presetName].steps;
        let total = 0;
        steps.forEach(s => total += (s.duration + s.fadeDuration));
        let stops = [];
        let pos = 0;
        steps.forEach(s => {
            let start = (pos / total) * 100;
            let end = ((pos + s.duration + s.fadeDuration) / total) * 100;
            stops.push(`rgb(${s.r},${s.g},${s.b}) ${start}% ${end}%`);
            pos += (s.duration + s.fadeDuration);
        });
        row.style.background = `linear-gradient(to right, ${stops.join(', ')})`;
    }

    const label = document.createElement('span');
    label.textContent = item.presetName;
    label.style.margin = '0 10px';
    label.style.fontWeight = 'bold';
    label.style.textShadow = '1px 1px 2px #000';
    row.appendChild(label);

    const durInput = document.createElement('input');
    durInput.type = 'number';
    durInput.value = item.duration;
    durInput.style.width = '70px';
    addEditListeners(durInput);
    durInput.onchange = (e) => { item.duration = parseInt(e.target.value); savePlaylist(); };
    row.appendChild(durInput);

    const upBtn = document.createElement('button'); upBtn.innerHTML = '&#8593;'; upBtn.className = 'step-btn';
    upBtn.onclick = () => { [playlist[index-1], playlist[index]] = [playlist[index], playlist[index-1]]; renderPlaylist(); savePlaylist(); };
    const downBtn = document.createElement('button'); downBtn.innerHTML = '&#8595;'; downBtn.className = 'step-btn';
    downBtn.onclick = () => { [playlist[index+1], playlist[index]] = [playlist[index], playlist[index+1]]; renderPlaylist(); savePlaylist(); };
    const delBtn = document.createElement('button'); delBtn.innerHTML = '&#10006;'; delBtn.className = 'step-btn';
    delBtn.onclick = () => { playlist.splice(index, 1); renderPlaylist(); savePlaylist(); };
    
    row.ondblclick = () => {
      fetch(`/playlistSkip?index=${index}`, { method: 'POST' })
        .then(response => {
          if (response.ok) {
            currentPlaylistIdx = index;
            renderPlaylist();
          }
        })
        .catch(err => console.error("Failed to skip playlist item:", err));
    };

    row.appendChild(upBtn); row.appendChild(downBtn); row.appendChild(delBtn);
    container.appendChild(row);
  });
}

async function apply(effect) {
    isSaving = true;
    const payload = {
        effect: effect,
        brightness: parseInt(document.getElementById('brightness').value),
        rainbowSpeed: 256 - parseInt(document.getElementById('rainbowSpeed').value),
        solidR: hexToRgb(colorInput.value).r,
        solidG: hexToRgb(colorInput.value).g,
        solidB: hexToRgb(colorInput.value).b,
        propagationMode: document.getElementById('propagationMode').checked,
        sequencerSteps: sequencerSteps
    };
    await fetch('/state', { method: 'POST', body: JSON.stringify(payload) });
    await fetch('/apply', { method: 'POST' });
    if(effect === 1) rainbowBtn.classList.add('active'); else rainbowBtn.classList.remove('active');
    isSaving = false;
}

function addStep() { sequencerSteps.push({r:255,g:0,b:0,duration:500,fadeDuration:100}); renderSequencer(); apply(2); }

function importPreset() {
  const fileInput = document.getElementById('importPresetFile');
  const file = fileInput.files[0];
  if (!file) return;
  const defaultPresetName = file.name.replace(/\.json$/i, '');
  const reader = new FileReader();
  reader.onload = async (e) => {
    let state;
    try {
      state = JSON.parse(e.target.result);
    } catch (err) {
      alert("Failed to parse preset file: " + err.message);
      return;
    }

    isSaving = true;

    if (state.sequencerSteps) {
      sequencerSteps = state.sequencerSteps;
      renderSequencer();
    }

    try {
      await fetch('/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(state)
      });
      await fetch('/apply', { method: 'POST' });
    } catch (err) {
      console.error("Failed to push imported state payload to hardware:", err);
    }

    fetchState();

    const presetName = prompt('Enter a name for the imported preset:', defaultPresetName);
    if (presetName && presetName.trim() !== "") {

      await fetch('/savePreset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: presetName.trim() })
      });
      
      loadPresets();
      alert(`Preset "${presetName}" imported and saved successfully!`);
    }

    isSaving = false;
    
    document.getElementById('importPresetFile').value = '';
  };

  reader.readAsText(file);
}


async function exportPlaylist() {
    if (!playlist || playlist.length === 0) { alert("Playlist is empty"); return; }
    const exportData = [];
    for (const item of playlist) {
        await fetch('/applyPreset?name=' + encodeURIComponent(item.presetName));
        const state = await fetch('/state');
        const presetState = await state.json();
        exportData.push({ duration: item.duration, preset: { name: item.presetName, state: presetState } });
    }
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'playlist.json'; a.click();
}

function importPlaylist() {
  const file = document.getElementById('importPlaylistFile').files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    let imported;
    try { imported = JSON.parse(e.target.result); if (!Array.isArray(imported)) throw new Error("Invalid format"); }
    catch (err) { alert("Failed to import playlist: " + err.message); return; }
    processImportedPlaylist(imported);
  };
  reader.readAsText(file);
}

async function processImportedPlaylist(imported) {
  for (const item of imported) {
    if (!item.preset || typeof item.duration !== "number") continue;
    await fetch('/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(item.preset.state) });
    await fetch('/apply', { method: 'POST' });
    await fetch('/savePreset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: item.preset.name }) });
    playlist.push({ presetName: item.preset.name, duration: item.duration });
  }
  renderPlaylist(); savePlaylist(); loadPresets();
}

async function loadPresets(){ 
    const r=await fetch('/getPresets'); 
    const a=await r.json(); 
    const plist = document.getElementById('presetList'); 
    plist.innerHTML=''; 
    presetsData = {}; 
    a.forEach(p=>{ 
        presetsData[p.name] = p; 
        const o=document.createElement('option'); 
        o.value=o.text=p.name; 
        plist.add(o); 
    }); 
}

function savePreset(){ const n=prompt('Preset name:'); if(!n) return; fetch('/savePreset',{method:'POST',body:JSON.stringify({name:n})}).then(loadPresets); }
function applyPreset(){ fetch('/applyPreset?name='+encodeURIComponent(document.getElementById('presetList').value)).then(fetchState); }
function deletePreset(){ fetch('/deletePreset?name='+encodeURIComponent(document.getElementById('presetList').value)).then(() => { loadPresets(); loadPlaylist(); }); }
function exportPreset(){ 
    const name = document.getElementById('presetList').value;
    if(!name) { alert("Select a preset first"); return; }
    fetch('/state').then(r=>r.json()).then(d=>{
        const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'})); a.download=name+'.json'; a.click();
    });
}
async function loadPlaylist(){ const r=await fetch('/playlist'); playlist=await r.json(); renderPlaylist(); }
function addPlaylistItem(){ const d=parseInt(prompt('Duration (ms):')); if(!document.getElementById('presetList').value||!d) return; playlist.push({presetName:document.getElementById('presetList').value,duration:d}); renderPlaylist(); savePlaylist(); }
function savePlaylist(){ fetch('/playlist',{ method:'POST', body:JSON.stringify(playlist) }); }
function playlistStart(){ fetch('/playlistStart',{method:'POST'}); }
function playlistStop(){ fetch('/playlistStop',{method:'POST'}); }

function fetchState(){ 
    fetch('/state').then(r=>r.json()).then(d=>{ 
        document.getElementById('statusDot').textContent = '● Connected';
        document.getElementById('statusDot').style.color = '#28a745';

        document.getElementById('brightness').value = d.brightness; 
        document.getElementById('rainbowSpeed').value = 256 - d.rainbowSpeed; 
        document.getElementById('propagationMode').checked = d.propagationMode; 
        
        currentEffect = d.effect; 
        if(currentEffect === 1) rainbowBtn.classList.add('active'); else rainbowBtn.classList.remove('active'); 
        
        if (!isEditing && !isSaving) {
            colorInput.value = rgbToHex(d.solidR, d.solidG, d.solidB); 
            colorBtn.style.backgroundColor = colorInput.value; 
            sequencerSteps = d.sequencerSteps;
            currentPlaylistIdx = d.currentPlaylistIndex;
            renderSequencer(); 
            renderPlaylist(); 
        }
    }); 
}

fetchState(); 
loadPresets().then(() => { loadPlaylist(); });
setInterval(fetchState, 300);
</script>
</body>
</html>
}
