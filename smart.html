<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Playlist - LED Poi</title>
<style>
  body { background: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
  #page { width: 100%; max-width: 500px; }
  .panel { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
  .panel h3 { margin-top: 0; text-align: center; color: #bb86fc; }
  button { background: #333; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin: 4px; transition: 0.2s; }
  button:hover { background: #444; }
  .btn-green { background: #1d5e2a; border: 1px solid #28a745; }
  .btn-red { background: #631c1c; border: 1px solid #dc3545; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
  .meter-bg { width: 100%; height: 14px; background: #2a2a2a; border-radius: 7px; overflow: hidden; margin: 8px 0; }
  .meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #28a745, #ffc107, #dc3545); transition: width 0.05s linear; }
  
  .playlistItem { position: relative; background: #252525; border: 1px solid #444; padding: 10px; margin: 6px 0; display: flex; align-items: center; justify-content: center; gap: 5px; border-radius: 8px; flex-wrap: wrap; }
  .playlistItem input[type="number"] { width: 65px; background: rgba(0,0,0,0.4); color: #fff; border: 1px solid #555; padding: 4px; border-radius: 3px; }
  .playlistItem select { background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #555; padding: 4px; border-radius: 3px; font-size: 12px; }
  .step-btn { background: rgba(0,0,0,0.4); color: #fff; border: 1px solid #555; border-radius: 3px; padding: 4px 8px; cursor: pointer; font-size: 14px; margin: 0; }
  .active-item { border: 2px solid #bb86fc !important; box-shadow: 0 0 10px #bb86fc; }
  #debugLog { font-family: monospace; font-size: 11px; color: #0f0; background: #000; padding: 6px; border-radius: 4px; margin-top: 8px; }
</style>
</head>
<body>
<div id="page">
  <div class="row" style="margin-bottom: 10px;">
    <button onclick="exitSmartMode()">&#8592; Back to Master Control</button>
    <span id="statusDot" style="font-size:12px; color:#ffc107;">● Connecting</span>
  </div>

  <!-- SMART AUDIO SYNC BOX -->
  <div class="panel" style="border-color: #28a745;">
    <h3 style="margin:0 0 10px 0; color:#28a745;">Smart Audio Sync (Active)</h3>

    <div class="row">
      <div>BPM: <strong id="bpmVal" style="font-size:18px; color:#4da6ff;">--</strong></div>
      <div>Energy: <strong id="energyLabel" style="color:#28a745;">LISTENING</strong></div>
      <div>Scale: <strong id="scaleVal">1.00x</strong></div>
    </div>

    <div class="meter-bg"><div id="bassMeter" class="meter-fill"></div></div>

    <div class="row" style="margin-top: 8px; font-size: 13px;">
      <label>Base BPM: <input type="number" id="baseBpm" value="128" min="60" max="200" style="width:55px; background:#252525; color:#fff; border:1px solid #444; padding:3px;"></label>
      <label style="flex:1; margin-left:10px;">Sensitivity: <input type="range" id="sensitivity" min="115" max="180" value="140" style="width:100%;"></label>
    </div>
    <div id="debugLog">Starting microphone automatically...</div>
  </div>

  <!-- PLAYLIST VIEWER -->
  <div class="panel">
    <h3>Smart Playlist Viewer</h3>
    <div style="text-align:center; font-size:12px; color:#aaa; margin-bottom:8px;">Double-tap any item to jump immediately</div>
    <div style="display:flex; justify-content:center; gap:8px; margin-bottom:10px;">
      <button class="btn-green" onclick="playlistStart()">Play</button>
      <button class="btn-red" onclick="playlistStop()">Pause</button>
      <button onclick="skipNext()">Skip Next</button>
    </div>
    <div id="playlistSteps"></div>
  </div>
</div>

<script src="./smart.js?v=2"></script>
</body>
</html>
